; OS Dubna, interactive: boots the dispatcher rebuilt on drum 25.
; Run from BUILD after bootstrap.sh (or mk-base.sh): besm6 dubna.ini
;
; This terminal is the operator console (tty25): press Enter, then give
; the date 040489D and the time T; at "ДАЙТЕ ПРИКАЗ А1Р" answer A1P.
; Multitype (tty26) is on telnet port 4199: two spaces, password MJPOP,
; buffer 7/M. Listings go to output.txt. See docs/Dubna_Commands.md.
; Images are changed in place; restore them with: cp data/base/*.bin data/
set -n console log=dubna-log.txt
set console debug=log
; The dispatcher keeps flags above bit 7 of page numbers: needs 128K.
set cpu mem=128
; The printer driver uses instruction 032 as ext.
set cpu ext32
set cpu latin
set cpu idle
attach -e drum0 data/dubdrum1.bin
attach -e drum1 data/dubdrum2.bin
attach -e md00 data/disk9.bin
attach -e md04 data/disk11.bin
attach -n prn0 output.txt
attach -n prn1 output1.txt
attach tty25 console
attach tty26 Line=26,4199
set tty25 unicode,authbs
set tty26 unicode,authbs

; Clear page 0.
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

; Panel program 9 reads the dispatcher from drum 25.
set cpu pult=9
load pult9-25.b6
go
; Switch registers: keep the input and output catalogs.
load boot_dubna-25.b6
set cpu pult=0
d 3 0

; Block the drum checksum verification.
d 2257 7777 7777 7777 7777

; At the planner: privileged exchanges for all slots, no resource check.
expect TTY:25,"ПЛАНИРОВЩИК" d 3 7777 7777 0000 0000; d 6 7417 7777 4000 0160; go

reset
d PC 1000
go
