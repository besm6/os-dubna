; Boot OS Dubna, mount a blank magnetic tape and format it.
; Usage: besm6 tape-format.ini image    (tape-format.sh makes the blank image)
; This terminal is the operator console; the script types the orders.
set cpu mem=128
set cpu ext32
set cpu latin
attach -e drum0 data/dubdrum1.bin
attach -e drum1 data/dubdrum2.bin
attach -e md00 data/disk9.bin
attach -e md04 data/disk11.bin
attach -n prn0 output.txt
attach -n prn1 output1.txt
attach tty25 console
set tty25 unicode,authbs

; Clear page 0.
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

; Read the dispatcher from drum 25 and set the switch registers.
set cpu pult=9
load pult9-25.b6
go
load boot_dubna-25.b6
set cpu pult=0
d 3 0
d 2257 7777 7777 7777 7777

; Start the system as in card-run.ini.
send delay=100000
reset
d PC 1000
go until "W23"
send "\r"
go until "!!!"
send "040489D\r"
go until "04/04/89"
send "T\r"
go until "ПЛАНИРОВЩИК"
d 3 7777 7777 0000 0000
d 6 7417 7777 4000 0160
send "A1P\r"
go until "А1Р"

; Put the reel on drive 60. Only the drives of direction 6 (mg60-mg67)
; can format. The reel is blank, so the system cannot read its label.
attach mg60 %1
go until "ОПОЗН.МЛ-60"
step 3000000

; The interlock: formatting is refused unless switch register 3 holds
; the drive number in bits 48-43.
d 3 6077 7777 0000 0000

; Order ИМР starts task 62: format the tape and name it (МР only formats).
; The task shows its letter, Ш23(S): an answer to it is a line ending
; with that letter and N. Before each answer the script waits a little:
; a character typed while the console is still printing is lost.
send "ИМР\r"
go until "МФ !"
step 3000000
; The drive.
send "60SN\r"
go until "ЗОН !"
step 3000000
; The number of zones, octal.
send "10SN\r"
go until "ИМЯ !"
step 3000000
; The name of the tape, up to 6 characters.
send "DEMOSN\r"
go until "БОБ!"
step 3000000
; The number of the reel.
send "1234SN\r"
; The task asks to confirm: DЕМО  /1234 (0010) МФ-60-ТАК ?
go until "ТАК ?"
step 3000000
send "SN\r"

; The task erases the start of the tape, then writes the zones.
go until "РАЗМЕЧЕНО"
go until "ЗОН."
step 3000000
quit
