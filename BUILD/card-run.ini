; Boot OS Dubna and run a job from a deck of punch cards.
; Usage: besm6 card-run.ini deck      (card-run.sh makes the deck from a job)
; This terminal is the operator console; the script types the orders.
; The listing goes to output.txt.
set cpu mem=128
set cpu ext32
set cpu latin
attach -e drum0 data/dubdrum1.bin
attach -e drum1 data/dubdrum2.bin
attach -e md00 data/disk9.bin
attach -e md04 data/disk11.bin
attach -n prn0 output.txt
attach -n prn1 output1.txt
attach tty25 console
set tty25 unicode,authbs

; The deck goes into card reader 0.
attach vu0 %1

; Clear page 0.
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

; Read the dispatcher from drum 25 and set the switch registers.
set cpu pult=9
load pult9-25.b6
go
load boot_dubna-25.b6
set cpu pult=0
d 3 0
d 2257 7777 7777 7777 7777

; Start the system and answer it as an operator would: "go until" runs
; until the console prints the text, "send" types a line. The console
; takes one character at a time, so typing is slow (DELAY in instructions).
send delay=100000
reset
d PC 1000
go until "W23"
send "\r"
go until "!!!"
; The date (only year 1989 is accepted), then the time.
send "040489D\r"
go until "04/04/89"
send "T\r"
go until "ПЛАНИРОВЩИК"
; Privileged exchanges for all slots, no resource check.
d 3 7777 7777 0000 0000
d 6 7417 7777 4000 0160
; Paper is in the printer (the echo shows A1P in Cyrillic lookalikes).
send "A1P\r"
go until "А1Р"
; Read the deck and run the job at once on Ш01.
send "01В\r"
; The job ends with a line like 0400-КШ01-00.00.18-НЕLLО.
go until "-КШ01-"
; The listing is printed some seconds later: run in short steps until
; output.txt ends with the trailer, a line of stars. The end of a step and
; a failed fgrep are both errors for "on".
set on
on step goto check
on error goto print
set nomessage
:print
step 20000000
:check
! fgrep -q '**************************************************************' output.txt
quit
