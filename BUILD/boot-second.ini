; Second boot of OS Dubna: run after boot-disks.ini.
set -n console log=boot-second-log.txt
set console debug=log
attach -e drum0 data/dubdrum1.bin
attach -e drum1 data/dubdrum2.bin
attach -e md00 data/disk9.bin
attach -e md04 data/disk11.bin
attach -n prn0 output.txt
attach tty25 console
set tty25 qwerty,authbs
set tty25 vt

; Clear page 0.
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

; Panel program 9 reads the dispatcher from drum 20.
set cpu pult=9
load pult9.b6
go

; Switch registers.
load boot_dubna.b6
set cpu pult=0
; Second boot: as the first, plus MS drums 21, 22 modelled from 9/MONSYS.
d 2 3730 0000 0000 0001
d 3 0
e 1-7

; Block the drum checksum verification.
d 2257 7777 7777 7777 7777

reset
d PC 1000
; About 100M instructions pass before the banner appears.
step 300000000

; Operator dialogue on the console (tty25). Input goes in with "send";
; 100M instructions is about 2 seconds of BESM-6 time.
send "\r"
step 100000000
send "040489D\r"
step 100000000
send "T\r"
step 100000000
; The dispatcher waits 16 seconds for disks, then starts the planner.
step 800000000
; Open drum 25, lift the resource check (as second-boot.ini did in 2017).
d 1 2000 0000 4000 0360
d 3 7700 0000 0000 0000
d 6 7417 7777 4000 0160
e 1-7
step 300000000
send "D\r"
step 300000000
quit
