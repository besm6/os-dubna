; OS Dubna driven from the second Consul (tty26), as expe.ex did in 2017.
; Run after boot-disks.ini.
set -n console log=boot-tty26-log.txt
set console debug=log
; The dispatcher keeps flags above bit 7 of page numbers: needs 128K.
set cpu mem=128
attach -e drum0 data/dubdrum1.bin
attach -e drum1 data/dubdrum2.bin
attach -e md00 data/disk9.bin
attach -e md04 data/disk11.bin
attach -n prn0 output.txt
attach tty26 console
set tty26 unicode,authbs
set tty26 vt

; Clear page 0.
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

; Panel program 9 reads the dispatcher from drum 20.
set cpu pult=9
load pult9.b6
go

; Switch registers.
load boot_dubna.b6
set cpu pult=0
; Second boot: as the first, plus MS drums 21, 22 modelled from 9/MONSYS.
d 2 3730 0000 0000 0001
d 3 0
e 1-7

; Block the drum checksum verification.
d 2257 7777 7777 7777 7777

reset
d PC 1000
; About 100M instructions pass before the banner appears.
step 300000000

; Let the system start (nothing is printed: the main console is not attached).
step 1200000000
d 1 2000 0000 4000 0360
d 3 7700 0000 0000 0000
d 6 7417 7777 4000 0160
; Become an operator console, set the date, release, bind to Multitype
; (two spaces). Multitype drops the line after about 10 s of silence.
send "OP"
step 100000000
send "\r"
step 100000000
send "040489D\r"
step 100000000
send "REF\r"
step 200000000
; Multitype: password, buffer, list and submit the job in zone 110.
send "  "
step 150000000
send "MJPOP\r"
step 150000000
send "7/M\r"
step 150000000
send "ЛИС 110\r"
step 300000000
send "СЛА 110,17\r"
step 300000000
send "KAK\r"
step 500000000
send "KAK\r"
step 300000000
quit
