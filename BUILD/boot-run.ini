; OS Dubna with both Consuls on sockets: started by boot-run.py, which listens
; on ports %TTY25% (operator console) and %TTY26% (Multitype) and drives them.
; Images come from mk-base.sh (data/base).
set -n console log=boot-run-log.txt
set console debug=log
; The dispatcher keeps flags above bit 7 of page numbers: needs 128K.
set cpu mem=128
; Latin lookalikes go to the printer as Latin (terminals are not affected).
set cpu latin
; The printer driver uses instruction 032 as ext.
set cpu ext32
set cpu idle=2
set debug -n boot-run-debug.txt
set prn debug
attach -e drum0 data/dubdrum1.bin
attach -e drum1 data/dubdrum2.bin
attach -e md00 data/disk9.bin
attach -e md04 data/disk11.bin
; ESPRN=0 or 1 makes that printer an ЕС-7032/7033 (ТР7 bit 34 or 33, below);
; with 1, ТР7 bit 46 locks out printer 0, so that the spooler takes printer 1.
; The x stops "" == "0" from matching: SIMH compares numbers.
if "x%ESPRN%" == "x0" set prn0 es
if "x%ESPRN%" == "x1" set prn1 es
attach -n prn0 output.txt
attach -n prn1 output1.txt
; The simulator dials out, so nothing printed before the first poll is lost.
attach tty25 Line=25,Connect=127.0.0.1:%TTY25%;notelnet
attach tty26 Line=26,Connect=127.0.0.1:%TTY26%;notelnet
set tty25 unicode,authbs
set tty26 unicode,authbs
; CARDS=file puts a deck into card reader 0: a text file, one card per line,
; punched in the UPP code, or with UPDK=1 in the UPDK code (the system takes both).
if "%CARDS%" == "" goto nocards
if "%VUDEBUG%" != "" set vu debug
attach vu0 %CARDS%
if "%UPDK%" != "" set vu0 updk
:nocards

; Clear page 0.
d -ml 1 xta, vtm 1777(1)
d -ml 2 atx (1), utm -1(1)
d -ml 3 v1m 2(1), stop
run 1

; Panel program 9 reads the dispatcher from drum 20, or with DRUM=25
; the one rebuilt by job newdd.
set cpu pult=9
if "%DRUM%" == "25" goto drum25
load pult9.b6
go
; Switch registers. Second boot: MS drums 21, 22 modelled from 9/MONSYS.
load boot_dubna.b6
set cpu pult=0
d 2 3730 0000 0000 0001
if "x%ESPRN%" == "x0" d 7 0000 1300 0140 0000
if "x%ESPRN%" == "x1" d 7 1000 0700 0140 0000
goto regs
:drum25
load pult9-25.b6
go
; Switch registers: keep the input and output catalogs.
load boot_dubna-25.b6
set cpu pult=0
if "x%ESPRN%" == "x0" d 7 0000 1000 0140 1200
if "x%ESPRN%" == "x1" d 7 1000 0400 0140 1200
:regs
d 3 0

; Block the drum checksum verification.
d 2257 7777 7777 7777 7777

; At the planner: privileged exchanges for all slots (newdd writes drum 25),
; lift the resource check. Drum 25 stays locked so that nothing is paged there.
expect TTY:25,"ПЛАНИРОВЩИК" d 3 7777 7777 0000 0000; d 6 7417 7777 4000 0160; go

reset
d PC 1000
go
